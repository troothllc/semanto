#
# Semanto on deploy: after each push, Semanto reads the site again and builds a new version, which waits for a person
# to review and sign it on trooth.co. Nothing is published from CI.
#
#   - uses: troothllc/semanto@v1
#     with:
#       trooth-id: your-trooth-id
#       api-key: ${{ secrets.TROOTH_API_KEY }}
#
# The key is an agent key from trooth.co/dashboard/api-keys, kept as a repository secret. The step passes when the
# build is queued or waits for a person (the trooth command's exit code 0 or 3).
name: Semanto on deploy
description: Rebuild the Semanto signed copy after a deploy; the new version waits for a person to sign it.
author: Trooth, LLC
branding:
  icon: check-circle
  color: blue
inputs:
  trooth-id:
    description: The company's Trooth ID.
    required: true
  api-key:
    description: A Trooth agent key, kept as a repository secret.
    required: true
  version:
    description: The trooth command line version to run.
    required: false
    default: "0.26.1"
runs:
  using: composite
  steps:
    - name: Build a new Semanto version
      shell: bash
      env:
        TROOTH_API_KEY: ${{ inputs.api-key }}
        TROOTH_ID: ${{ inputs.trooth-id }}
        TROOTH_VERSION: ${{ inputs.version }}
      run: |
        set +e
        case "$TROOTH_ID" in *[!a-z0-9-]*|"") echo "::error::trooth-id is lowercase letters, digits and dashes"; exit 2;; esac
        case "$TROOTH_VERSION" in *[!0-9.]*|"") echo "::error::version is a release number such as 0.26.1"; exit 2;; esac
        npx --yes "trooth@${TROOTH_VERSION}" api -X POST "/os/semanto/${TROOTH_ID}/build"
        code=$?
        if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
        echo "The new version waits for a person: https://trooth.co/dashboard/semanto"
