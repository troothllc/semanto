#
# Stages @trooth/semanto-verify (verifier/js) on npm on a tag js-v<version>, by npm trusted publishing (OIDC: no
# token is stored). The trusted publisher is stage-only: a maintainer approves each staged version with 2FA on
# npmjs.com before it goes out. Each release carries npm provenance, a cosign keyless signature and GitHub build
# provenance on the release files.
name: Publish @trooth/semanto-verify

on:
  push:
    tags: ["js-v*"]
  # The release workflow starts this on the new tag; a tag pushed by a workflow does not start runs by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Test, then publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@trooth/semanto-verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: verifier/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.15.0 or later (staged publishing needs it), from a lockfile
        working-directory: .github/npm-cli
        run: npm ci --no-audit --no-fund && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: The tag is the package version
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "js-v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }
      - name: Test against the shared vectors
        run: node --test test/vectors.test.mjs
      - name: Pack once; this file is the one published and signed
        run: mkdir -p ../../release && npm pack --pack-destination ../../release
      - name: Publish with provenance
        run: npm stage publish ../../release/trooth-semanto-verify-*.tgz --provenance --access public
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Checksums and a keyless signature for each release file
        working-directory: release
        run: |
          sha256sum trooth-semanto-verify-*.tgz > SHA256SUMS
          for f in trooth-semanto-verify-*.tgz SHA256SUMS; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/trooth-semanto-verify-*.tgz
      - name: The GitHub release for this tag
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --verify-tag --title "@trooth/semanto-verify ${GITHUB_REF_NAME#js-v}" --generate-notes
